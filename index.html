<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="./manifest.json">

<title>Elevator English</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --text: #f0ede6;
    --muted: #6b6880;
    --accent: #2a2538;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    position: relative;
  }

  /* Background grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow */
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Day badge */
  .day-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .day-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--muted));
  }

  .day-line.right {
    background: linear-gradient(to left, transparent, var(--muted));
  }

  .day-text {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Phrase number */
  .phrase-num {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Main English phrase */
  .phrase-en {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    position: relative;
  }

  .phrase-en::after {
    content: '';
    display: block;
    width: 48px;
    height: 2px;
    background: var(--gold);
    margin-top: 18px;
  }

  /* Japanese translation */
  .phrase-ja {
    font-size: 16px;
    font-weight: 300;
    color: rgba(240,237,230,0.6);
    margin-bottom: 28px;
    letter-spacing: 0.05em;
    animation: fadeUp 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Context box */
  .context-box {
    background: var(--accent);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .context-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .context-text {
    font-size: 13px;
    line-height: 1.7;
    color: rgba(240,237,230,0.75);
    font-weight: 300;
  }

  /* Example sentence */
  .example-en {
    font-size: 14px;
    font-style: italic;
    color: rgba(240,237,230,0.55);
    font-family: 'DM Sans', sans-serif;
    margin-bottom: 4px;
    animation: fadeUp 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .example-ja {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    animation: fadeUp 0.8s 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Bottom info */
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    animation: fadeUp 0.8s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .date-display {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .dots {
    display: flex;
    gap: 5px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.3;
    transition: all 0.3s;
  }

  .dot.active {
    background: var(--gold);
    opacity: 1;
    transform: scale(1.3);
  }

  /* Tag */
  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Review badge (第7回: 復習を自然に織り込む) */
  .review-badge {
    display: none;
    margin-left: 8px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--bg);
    background: var(--gold);
    border-radius: 10px;
    padding: 2px 7px;
    vertical-align: middle;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .review-badge.show { display: inline-block; }

  /* Back to today (第2回 Rule10: 不要なステップを消す) */
  .back-today {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 3;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid rgba(107,104,128,0.4);
    border-radius: 16px;
    padding: 5px 12px;
    background: rgba(19,19,26,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    cursor: pointer;
  }
  .back-today.show { opacity: 1; pointer-events: auto; }

  /* Swipe hint */
  .swipe-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    z-index: 2;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
</style>
</head>

// Spaced-repetition schedule: introduce each phrase once, then weave in
// reviews at expanding intervals so review happens naturally in the daily
// flow rather than as a separate, boring "review mode" (ADS 第7回).
function buildSchedule(n) {
  const gaps = [2, 5, 11, 25];
  const reviewsAt = {};
  const seq = [];
  let next = 0, pos = 0, maxPos = 0;
  while (next < n || pos <= maxPos) {
    if (reviewsAt[pos]) {
      for (const idx of reviewsAt[pos]) seq.push({ idx, review: true });
    }
    if (next < n) {
      seq.push({ idx: next, review: false });
      for (const g of gaps) {
        const rp = pos + g;
        (reviewsAt[rp] = reviewsAt[rp] || []).push(next);
        if (rp > maxPos) maxPos = rp;
      }
      next++;
    }
    pos++;
  }
  return seq;
}
const SCHEDULE = buildSchedule(phrases.length);

// Random position in the schedule: a fresh phrase every time the app opens.
function randomPos(avoidIdx) {
  let pos, tries = 0;
  do { pos = Math.floor(Math.random() * SCHEDULE.length); tries++; }
  while (avoidIdx != null && SCHEDULE[pos].idx === avoidIdx && tries < 20);
  return pos;
}
let lastIdx = null;
try { const v = localStorage.getItem('ee_last'); lastIdx = v === null ? null : Number(v); } catch (e) {}
let basePos = randomPos(lastIdx);

// (ADS 第2回: 認知コストを下げる軽量ビジュアル).
function tagColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) % 360;
  return `hsl(${h}, 42%, 64%)`;
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}.${m}.${day}`;
}

function getDayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

const DAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

let currentOffset = 0; // offset from today
const TOTAL_SHOW = 5;

function renderPhrase(offset) {
  const pos = ((basePos + offset) % SCHEDULE.length + SCHEDULE.length) % SCHEDULE.length;
  const slot = SCHEDULE[pos];
  const idx = slot.idx;
  const p = phrases[idx];

  // remember the phrase shown on open/shuffle, to avoid repeating it next time
  if (offset === 0) { try { localStorage.setItem('ee_last', String(idx)); } catch (e) {} }

  document.getElementById('phraseNumText').textContent = `Phrase #${String(idx + 1).padStart(3, '0')} / ${phrases.length}`;
  document.getElementById('reviewBadge').className = 'review-badge' + (slot.review ? ' show' : '');

  const tagEl = document.getElementById('tag');
  tagEl.textContent = p.tag;
  const col = tagColor(p.tag);
  tagEl.style.color = col;
  tagEl.style.borderColor = col;

  document.getElementById('phraseEn').childNodes[0].textContent = p.en;
  document.getElementById('phraseJa').textContent = p.ja;
  document.getElementById('context').textContent = p.context;
  document.getElementById('exampleEn').textContent = p.exEn;
  document.getElementById('exampleJa').textContent = p.exJa;
  document.getElementById('dateDisplay').textContent = formatDate(new Date());

  // shuffle button is always available
  document.getElementById('shuffleBtn').className = 'back-today show';

  // dots: center = current phrase
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  const range = Math.floor(TOTAL_SHOW / 2);
  for (let i = -range; i <= range; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dots.appendChild(dot);
  }
}

// Animate card transition
function switchPhrase(newOffset) {
  const card = document.getElementById('card');
  card.style.transition = 'opacity 0.2s, transform 0.2s';
  card.style.opacity = '0';
  card.style.transform = 'translateY(10px)';
  setTimeout(() => {
    currentOffset = newOffset;
    renderPhrase(currentOffset);
    card.style.transform = 'translateY(-10px)';
    setTimeout(() => {
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    }, 20);
  }, 200);
}

// Touch swipe
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) {
    switchPhrase(currentOffset + (dx < 0 ? 1 : -1));
  }
});

// Click tap (left half = back, right half = forward)
document.addEventListener('click', e => {
  if (e.target.closest('#shuffleBtn')) return;
  const x = e.clientX;
  const w = window.innerWidth;
  switchPhrase(currentOffset + (x < w / 2 ? -1 : 1));
});

// Keyboard navigation (desktop): no visible buttons added (Rule 10)
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') switchPhrase(currentOffset - 1);
  else if (e.key === 'ArrowRight') switchPhrase(currentOffset + 1);
  else if (e.key === 'Home') switchPhrase(0);
});

// Shuffle: jump to a new random phrase
document.getElementById('shuffleBtn').addEventListener('click', e => {
  e.stopPropagation();
  const curIdx = SCHEDULE[((basePos + currentOffset) % SCHEDULE.length + SCHEDULE.length) % SCHEDULE.length].idx;
  basePos = randomPos(curIdx);
  switchPhrase(0);
});

// Init
renderPhrase(0);
</script>

  });
