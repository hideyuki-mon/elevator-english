<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Elevator English</title>
<style>
  /* Self-hosted fonts: work fully offline, no render-blocking CDN request.
     Japanese falls back to the system sans-serif (Noto Sans on Android). */
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 100 1000;
    font-display: swap;
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/dm-sans-latin-italic.woff2') format('woff2');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --text: #f0ede6;
    --muted: #8a87a0; /* WCAG AA contrast on --bg */
    --accent: #2a2538;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-y: auto;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    position: relative;
  }

  /* Background grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow */
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Phrase number */
  .phrase-num {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Main English phrase */
  .phrase-en {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    position: relative;
    user-select: text; /* let learners copy the phrase */
    overflow-wrap: break-word;
  }

  .phrase-en::after {
    content: '';
    display: block;
    width: 48px;
    height: 2px;
    background: var(--gold);
    margin-top: 18px;
  }

  /* Japanese translation */
  .phrase-ja {
    font-size: 16px;
    font-weight: 300;
    color: rgba(240,237,230,0.6);
    margin-bottom: 28px;
    letter-spacing: 0.05em;
    animation: fadeUp 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Context box */
  .context-box {
    background: var(--accent);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .context-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .context-text {
    font-size: 13px;
    line-height: 1.7;
    color: rgba(240,237,230,0.75);
    font-weight: 300;
  }

  /* Example sentence */
  .example-en {
    font-size: 14px;
    font-style: italic;
    color: rgba(240,237,230,0.55);
    font-family: 'DM Sans', sans-serif;
    margin-bottom: 4px;
    animation: fadeUp 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    user-select: text;
  }

  .example-ja {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    animation: fadeUp 0.8s 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Bottom info */
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    animation: fadeUp 0.8s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .date-display {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .progress {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.1em;
  }

  /* Tag */
  .tag {
    align-self: flex-start;
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Review badge (第7回: 復習を自然に織り込む) */
  .review-badge {
    display: none;
    margin-left: 8px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--bg);
    background: var(--gold);
    border-radius: 10px;
    padding: 2px 7px;
    vertical-align: middle;
  }
  .review-badge.show { display: inline-block; }

  /* Fixed corner buttons: shuffle (top-left) / speak (top-right).
     Real <button> elements, 44px+ hit targets. */
  .corner-btn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    z-index: 3;
    min-height: 44px;
    min-width: 44px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid rgba(138,135,160,0.4);
    border-radius: 22px;
    padding: 8px 14px;
    background: rgba(19,19,26,0.7);
    cursor: pointer;
  }
  .corner-btn:active { background: rgba(42,37,56,0.9); }
  .shuffle-btn { left: 16px; }
  .speak-btn { right: 16px; font-size: 17px; }

  /* Swipe hint */
  .swipe-hint {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    z-index: 2;
    white-space: nowrap;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  /* Fast, single entrance: the stagger delays above collapse into one
     quick fade so a 30-second elevator ride isn't spent on animation. */
  .card, .card * {
    animation-duration: 0.35s !important;
    animation-delay: 0.02s !important;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  /* 1-minute recall session */
  .topbar {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  .timer-wrap {
    height: 3px;
    background: rgba(201,168,76,0.18);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .timer-bar {
    height: 100%;
    width: 100%;
    background: var(--gold);
    transform-origin: left center;
    transform: scaleX(1);
  }

  .top-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    min-width: 3.2em;
  }

  .timer.low { color: #e07a5f; }

  .ride, .count {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .count { margin-left: auto; }

  .icon-btn {
    min-width: 44px;
    min-height: 44px;
    font-family: inherit;
    font-size: 17px;
    color: var(--muted);
    border: 1px solid rgba(138,135,160,0.4);
    border-radius: 22px;
    background: rgba(19,19,26,0.7);
    cursor: pointer;
  }

  .icon-btn:active { background: rgba(42,37,56,0.9); }

  .card { min-height: 0; cursor: pointer; }
  body[data-phase="back"] .card {
    cursor: default;
    justify-content: flex-start;
    overflow-y: auto;
  }

  .phrase-en.long { font-size: clamp(22px, 6vw, 32px); }

  .recall-prompt {
    margin-top: 4px;
    font-size: 14px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .back { padding-bottom: 108px; }

  .grade {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(28px + env(safe-area-inset-bottom));
    z-index: 4;
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 0 20px;
  }

  .grade-btn {
    flex: 1;
    max-width: 200px;
    min-height: 52px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 0.08em;
    border-radius: 14px;
    cursor: pointer;
  }

  .grade-btn.again {
    color: var(--text);
    background: rgba(19,19,26,0.92);
    border: 1px solid rgba(138,135,160,0.5);
  }

  .grade-btn.knew {
    color: #0a0a0f;
    background: var(--gold);
    border: none;
    font-weight: 700;
  }

  .summary {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: auto;
    text-align: center;
    padding-top: 10vh;
  }

  .summary-kicker {
    color: var(--gold);
    letter-spacing: 0.18em;
    font-size: 12px;
    margin-bottom: 18px;
  }

  .summary-stat {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .summary-split {
    font-size: 16px;
    color: rgba(240,237,230,0.8);
    margin-bottom: 18px;
  }

  .summary-note {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .again-min {
    min-height: 48px;
    padding: 0 22px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--gold-light);
    background: transparent;
    border: 1px solid rgba(201,168,76,0.45);
    border-radius: 24px;
    cursor: pointer;
  }

  .topbar[hidden],
  .card[hidden],
  .back[hidden],
  .grade[hidden],
  .summary[hidden],
  .recall-prompt[hidden],
  .swipe-hint[hidden],
  .icon-btn[hidden] {
    display: none !important;
  }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="timer-wrap" aria-hidden="true"><div class="timer-bar" id="timerBar"></div></div>
  <div class="top-meta">
    <span class="timer" id="timer">1:00</span>
    <span class="ride" id="ride">今日 1回目</span>
    <span class="count" id="count">この1分 0枚</span>
    <button type="button" class="icon-btn" id="speakBtn" aria-label="英文を読み上げる">🔊</button>
  </div>
</div>

<div class="card" id="card" aria-live="polite">
  <div class="phrase-num"><span id="phraseNumText">1 / 15</span><span class="review-badge" id="reviewBadge">復習</span></div>
  <div class="tag" id="tag">Vocab</div>
  <h1 class="phrase-en" id="phraseEn" lang="en"></h1>
  <p class="recall-prompt" id="prompt">意味が浮かぶ？</p>
  <div class="back" id="back" hidden>
    <div class="phrase-ja" id="phraseJa"></div>
    <div class="context-box">
      <div class="context-label">確認</div>
      <div class="context-text" id="context"></div>
    </div>
    <div class="example-en" id="exampleEn" lang="en"></div>
    <div class="example-ja" id="exampleJa"></div>
  </div>
</div>

<div class="grade" id="grade" hidden>
  <button type="button" class="grade-btn again" id="btnAgain">もう一度</button>
  <button type="button" class="grade-btn knew" id="btnKnew">即答</button>
</div>

<div class="summary" id="summary" hidden>
  <p class="summary-kicker" id="summaryKicker">1分終了</p>
  <p class="summary-stat" id="summaryStat"></p>
  <p class="summary-split" id="summarySplit"></p>
  <p class="summary-note" id="summaryNote"></p>
  <button type="button" class="again-min" id="btnMore">もう1分</button>
</div>

<p class="swipe-hint" id="swipeHint">タップで意味。出たら 即答 / もう一度</p>

<script>
const phrases = [
  {
    "tag": "Synonym",
    "en": "affect vs. effect",
    "ja": "影響を与える／影響（結果）",
    "context": "affectは動詞「〜に影響する」、effectは名詞「影響・効果」。品詞の違いがCASEC語彙問題の定番の狙い目。",
    "exEn": "\"The delay will affect our schedule.\" / \"The effect was immediate.\"",
    "exJa": "「その遅れはスケジュールに影響する」／「効果はすぐに現れた」"
  },
  {
    "tag": "Synonym",
    "en": "borrow vs. lend",
    "ja": "借りる／貸す",
    "context": "borrowは「（人から）借りる」、lendは「（人に）貸す」で方向が逆。混同しやすいペア。",
    "exEn": "\"Can I borrow your pen?\" \"Sure, I'll lend it to you.\"",
    "exJa": "「ペン借りていい？」「いいよ、貸すね」"
  },
  {
    "tag": "Synonym",
    "en": "few vs. a few",
    "ja": "ほとんどない／少しはある",
    "context": "fewは否定的に「ほとんどない」、a fewは肯定的に「少しある」。可算名詞に使う。",
    "exEn": "\"Few people came.\" vs. \"A few people came.\"",
    "exJa": "「ほとんど人が来なかった」対「数人は来た」"
  },
  {
    "tag": "Synonym",
    "en": "little vs. a little",
    "ja": "ほとんどない／少しはある",
    "context": "fewとa fewの不可算名詞版。littleは否定的、a littleは肯定的なニュアンス。",
    "exEn": "\"I have little time.\" vs. \"I have a little time.\"",
    "exJa": "「時間がほとんどない」対「少し時間がある」"
  },
  {
    "tag": "Synonym",
    "en": "comprise vs. compose",
    "ja": "〜から成る／〜を構成する",
    "context": "「全体 comprise 部分」、「部分 compose 全体」の語順が逆。be comprised ofは口語で使われるが本来は誤用とされる点も出題される。",
    "exEn": "\"The committee comprises ten members.\"",
    "exJa": "「その委員会は10人のメンバーから成る」"
  },
  {
    "tag": "Synonym",
    "en": "raise vs. rise",
    "ja": "〜を上げる（他動詞）／上がる（自動詞）",
    "context": "raiseは目的語を取る他動詞、riseは目的語を取らない自動詞。この対比は語法問題の定番。",
    "exEn": "\"Prices rose sharply.\" / \"They raised the price.\"",
    "exJa": "「価格が急上昇した」／「彼らは価格を上げた」"
  },
  {
    "tag": "Synonym",
    "en": "economic vs. economical",
    "ja": "経済の／経済的な・節約になる",
    "context": "economicは「経済（学）の」、economicalは「無駄がない・お得な」という意味。形容詞の使い分け頻出。",
    "exEn": "\"an economic policy\" vs. \"an economical car\"",
    "exJa": "「経済政策」対「燃費のいい（お得な）車」"
  },
  {
    "tag": "Synonym",
    "en": "sensible vs. sensitive",
    "ja": "分別のある／敏感な",
    "context": "sensibleは「賢明な・理にかなった」、sensitiveは「敏感な・繊細な」。スペルが似ていて誤答を誘う典型例。",
    "exEn": "\"a sensible decision\" vs. \"a sensitive topic\"",
    "exJa": "「賢明な決断」対「デリケートな話題」"
  },
  {
    "tag": "Synonym",
    "en": "look at vs. see vs. watch",
    "ja": "注視する／見える／動くものを見る",
    "context": "look atは意識的に見る、seeは自然に目に入る、watchは動きのあるものを注視する。使い分けが問われる。",
    "exEn": "\"I saw him watching TV when I looked at the door.\"",
    "exJa": "「ドアを見たとき、彼がテレビを見ているのが見えた」"
  },
  {
    "tag": "Synonym",
    "en": "say vs. tell vs. speak vs. talk",
    "ja": "言う（目的語なし）／伝える（人が目的語）／話す（言語）／話す（会話）",
    "context": "tell人 that...の型、say that...の型など、目的語の取り方の違いが語法問題で狙われる。",
    "exEn": "\"He told me that he speaks French.\"",
    "exJa": "「彼はフランス語を話すと私に言った」"
  },
  {
    "tag": "Vocab",
    "en": "consequently",
    "ja": "その結果として",
    "context": "原因→結果をつなぐ副詞。CASEC表現問題やリスニング大意で論理関係を把握する鍵となる語。",
    "exEn": "\"It rained heavily. Consequently, the game was canceled.\"",
    "exJa": "「大雨が降った。その結果、試合は中止になった」"
  },
  {
    "tag": "Vocab",
    "en": "nevertheless",
    "ja": "それにもかかわらず",
    "context": "逆接を表すフォーマルな接続副詞。文と文の論理関係を問う問題で頻出。",
    "exEn": "\"The plan was risky. Nevertheless, they went ahead.\"",
    "exJa": "「その計画は危険だった。それにもかかわらず彼らは実行した」"
  },
  {
    "tag": "Vocab",
    "en": "furthermore",
    "ja": "さらに、その上",
    "context": "情報を追加する接続副詞。moreover、in additionと同義でCASEC読解・リスニングの論理マーカーとして重要。",
    "exEn": "\"The hotel is cheap. Furthermore, it's close to the station.\"",
    "exJa": "「そのホテルは安い。その上、駅からも近い」"
  },
  {
    "tag": "Vocab",
    "en": "reluctant",
    "ja": "気が進まない、しぶしぶの",
    "context": "be reluctant to doの形でよく出る。willingの対義語として語彙問題で狙われる。",
    "exEn": "\"She was reluctant to accept the offer.\"",
    "exJa": "「彼女はその申し出を受け入れるのに気が進まなかった」"
  },
  {
    "tag": "Vocab",
    "en": "postpone",
    "ja": "延期する",
    "context": "put off と同義。ビジネス会話・アナウンスのリスニング問題で頻出の語。",
    "exEn": "\"The meeting has been postponed until next week.\"",
    "exJa": "「会議は来週まで延期された」"
  },
  {
    "tag": "Vocab",
    "en": "reimburse",
    "ja": "（費用を）払い戻す",
    "context": "ビジネス語彙。経費精算の文脈でCASECのオフィス系リスニングによく登場する。",
    "exEn": "\"The company will reimburse your travel expenses.\"",
    "exJa": "「会社が出張費を払い戻します」"
  },
  {
    "tag": "Vocab",
    "en": "inventory",
    "ja": "在庫、棚卸し",
    "context": "ビジネス頻出語。stockとほぼ同義だが、より正式な文脈で使われる。",
    "exEn": "\"We need to check the inventory before ordering more.\"",
    "exJa": "「追加発注の前に在庫を確認する必要がある」"
  },
  {
    "tag": "Vocab",
    "en": "candidate",
    "ja": "候補者",
    "context": "採用・選挙関連のリスニング・読解で頻出。応募者applicantとほぼ同義で使われることも。",
    "exEn": "\"Three candidates applied for the position.\"",
    "exJa": "「その職に3人の候補者が応募した」"
  },
  {
    "tag": "Vocab",

// Elevator minute = retrieval practice only.
// One calendar day locks a set of 15 (misses first, then a few reviews, then new).
// Each open is one 60s ride: English only, tap to reveal Japanese, then 即答 / もう一度.
// 即答 grows the gap (1 → 3 → 7 → 16 → 35 days). もう一度 stays due and leads the next ride.
// Listening-tagged cards wait behind vocab / expressions. Commute input and dictation stay outside this app.
const REVIEW_GAPS_DAYS = [1, 3, 7, 16, 35];
const DAY_MS = 24 * 60 * 60 * 1000;
const SESSION_MS = 60 * 1000;
const DAY_SET = 15;
const REVIEW_SLOTS = 5;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('ee_history')) || {}; }
  catch (e) { return {}; }
}
const history = loadHistory();
function saveHistory() {
  try { localStorage.setItem('ee_history', JSON.stringify(history)); } catch (e) {}
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function loadDay() {
  try {
    const v = JSON.parse(localStorage.getItem('ee_day'));
    if (v && v.d === todayKey() && Array.isArray(v.set)) return v;
  } catch (e) {}
  return { d: todayKey(), again: [], known: [], rides: 0, set: null };
}
let day = loadDay();
function saveDay() {
  try { localStorage.setItem('ee_day', JSON.stringify(day)); } catch (e) {}
}

function validIndex(i) {
  return Number.isInteger(i) && i >= 0 && i < phrases.length;
}
function dueIndices() {
  const now = Date.now(), due = [];
  for (const k in history) {
    const rec = history[k];
    if (!rec) continue;
    const n = rec.n || 1;
    const gap = REVIEW_GAPS_DAYS[Math.min(Math.max(n - 1, 0), REVIEW_GAPS_DAYS.length - 1)];
    const idx = Number(k);
    if (!validIndex(idx)) continue;
    if (rec.force || now - rec.t >= gap * DAY_MS) due.push(idx);
  }
  return due;
}
function unseenIndices() {
  const u = [];
  for (let i = 0; i < phrases.length; i++) if (!(i in history)) u.push(i);
  return u;
}
function sortRecall(arr) {
  return arr.slice().sort((a, b) => {
    const la = phrases[a].tag === 'Listening' ? 1 : 0;
    const lb = phrases[b].tag === 'Listening' ? 1 : 0;
    return la - lb || a - b;
  });
}
function takeInto(picked, arr, n) {
  for (const i of arr) {
    if (picked.length >= DAY_SET || n <= 0) break;
    if (!validIndex(i) || picked.includes(i)) continue;
    picked.push(i);
    n--;
  }
}
function ensureDaySet() {
  if (Array.isArray(day.set) && day.set.length) {
    day.set = day.set.filter(validIndex);
    if (day.set.length) return;
  }
  const due = dueIndices();
  const forced = due.filter(i => history[i] && history[i].force);
  const scheduled = due.filter(i => !(history[i] && history[i].force));
  const picked = [];
  takeInto(picked, sortRecall(forced), DAY_SET);
  const reviewN = Math.min(REVIEW_SLOTS, scheduled.length, DAY_SET - picked.length);
  takeInto(picked, sortRecall(scheduled), reviewN);
  takeInto(picked, sortRecall(unseenIndices()), DAY_SET - picked.length);
  const filler = [];
  for (let i = 0; i < phrases.length; i++) if (!picked.includes(i)) filler.push(i);
  filler.sort((a, b) => ((history[a] && history[a].n) || 0) - ((history[b] && history[b].n) || 0) || a - b);
  takeInto(picked, filler, DAY_SET - picked.length);
  day.set = picked;
  day.again = (day.again || []).filter(i => picked.includes(i));
  day.known = (day.known || []).filter(i => picked.includes(i));
  saveDay();
}

function tagColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) % 360;
  return `hsl(${h}, 42%, 64%)`;
}

let hintCount = 0;
try { hintCount = Number(localStorage.getItem('ee_hint_recall') || 0); } catch (e) {}
function bumpHint() {
  hintCount++;
  try { localStorage.setItem('ee_hint_recall', String(hintCount)); } catch (e) {}
  if (hintCount > 6) document.getElementById('swipeHint').hidden = true;
}

const card = document.getElementById('card');
const back = document.getElementById('back');
const gradeBar = document.getElementById('grade');
const summary = document.getElementById('summary');
const promptEl = document.getElementById('prompt');
const hintEl = document.getElementById('swipeHint');
const speakBtn = document.getElementById('speakBtn');

let queue = [];
let pos = 0;
let phase = 'front';
let ended = false;
let grading = false;
let knewCount = 0;
let missCount = 0;
let seenCount = 0;
let remainingMs = SESSION_MS;
let endsAt = 0;
let timerOn = false;
let raf = 0;

function paintTimer() {
  const sec = Math.ceil(remainingMs / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  const timer = document.getElementById('timer');
  timer.textContent = `${m}:${String(s).padStart(2, '0')}`;
  timer.classList.toggle('low', sec <= 10 && sec > 0);
  document.getElementById('timerBar').style.transform = `scaleX(${Math.max(0, remainingMs) / SESSION_MS})`;
}
function paintRide() {
  document.getElementById('ride').textContent = `今日 ${day.rides}回目`;
  document.getElementById('count').textContent = `この1分 ${seenCount}枚`;
}
function tick() {
  if (!timerOn) return;
  remainingMs = Math.max(0, endsAt - Date.now());
  paintTimer();
  if (remainingMs <= 0) {
    timerOn = false;
    finish('time');
    return;
  }
  raf = requestAnimationFrame(tick);
}
function startTimer() {
  if (ended || timerOn) return;
  endsAt = Date.now() + remainingMs;
  timerOn = true;
  raf = requestAnimationFrame(tick);
}
function pauseTimer() {
  if (!timerOn) return;
  remainingMs = Math.max(0, endsAt - Date.now());
  timerOn = false;
  cancelAnimationFrame(raf);
}

function buildQueue() {
  const set = day.set;
  const again = day.again.filter(i => set.includes(i));
  const rest = set.filter(i => !day.again.includes(i) && !day.known.includes(i));
  const known = day.known.filter(i => set.includes(i));
  return [...again, ...rest, ...known];
}

function showFront() {
  phase = 'front';
  grading = false;
  document.body.dataset.phase = 'front';
  const idx = queue[pos];
  const p = phrases[idx];
  back.hidden = true;
  gradeBar.hidden = true;
  promptEl.hidden = false;
  card.hidden = false;
  speakBtn.hidden = false;
  hintEl.hidden = hintCount > 6;

  const badge = document.getElementById('reviewBadge');
  const isAgain = day.again.includes(idx);
  const rec = history[idx];
  let isReview = false;
  if (!isAgain && rec) {
    const n = rec.n || 1;
    const gap = REVIEW_GAPS_DAYS[Math.min(Math.max(n - 1, 0), REVIEW_GAPS_DAYS.length - 1)];
    isReview = !!(rec.force || Date.now() - rec.t >= gap * DAY_MS);
  }
  badge.textContent = isAgain ? 'もう一度' : '復習';
  badge.className = 'review-badge' + ((isAgain || isReview) ? ' show' : '');

  document.getElementById('phraseNumText').textContent = `${pos + 1} / ${day.set.length}`;
  const tagEl = document.getElementById('tag');
  tagEl.textContent = p.tag;
  const col = tagColor(p.tag);
  tagEl.style.color = col;
  tagEl.style.borderColor = col;

  const enEl = document.getElementById('phraseEn');
  enEl.textContent = p.en;
  enEl.classList.toggle('long', p.en.length > 28);
  document.getElementById('phraseJa').textContent = p.ja;
  document.getElementById('context').textContent = p.context;
  document.getElementById('exampleEn').textContent = p.exEn;
  document.getElementById('exampleJa').textContent = p.exJa;
  paintRide();
}

function reveal() {
  if (phase !== 'front' || ended) return;
  phase = 'back';
  document.body.dataset.phase = 'back';
  promptEl.hidden = true;
  back.hidden = false;
  gradeBar.hidden = false;
  hintEl.hidden = true;
  bumpHint();
}

function grade(knew) {
  if (phase !== 'back' || grading || ended) return;
  grading = true;
  const idx = queue[pos];
  const prev = history[idx] || { n: 0 };
  if (knew) {
    history[idx] = { n: (prev.n || 0) + 1, t: Date.now() };
    if (!day.known.includes(idx)) day.known.push(idx);
    day.again = day.again.filter(i => i !== idx);
    knewCount++;
  } else {
    history[idx] = { n: Math.max(prev.n || 0, 1), t: Date.now(), force: true };
    if (!day.again.includes(idx)) day.again.push(idx);
    day.known = day.known.filter(i => i !== idx);
    missCount++;
  }
  seenCount++;
  saveHistory();
  saveDay();
  paintRide();
  pos++;
  if (remainingMs <= 0) { finish('time'); return; }
  if (pos >= queue.length) {
    const missedNow = day.again.filter(i => day.set.includes(i));
    if (missedNow.length && remainingMs >= 2500) {
      queue.push(...missedNow);
      showFront();
      return;
    }
    finish(missedNow.length ? 'time' : 'complete');
    return;
  }
  showFront();
}

function finish(reason) {
  if (ended) return;
  ended = true;
  phase = 'done';
  document.body.dataset.phase = 'done';
  pauseTimer();
  paintTimer();
  card.hidden = true;
  gradeBar.hidden = true;
  hintEl.hidden = true;
  speakBtn.hidden = true;
  summary.hidden = false;
  document.getElementById('summaryKicker').textContent = reason === 'complete' ? '今日のセットを一周' : '1分終了';
  document.getElementById('summaryStat').textContent = `${seenCount}枚`;
  document.getElementById('summarySplit').textContent = `即答 ${knewCount} · もう一度 ${missCount}`;
  let note;
  if (!seenCount) note = '英語を見て、意味が浮かぶかを先に思い出してください。';
  else if (day.again.length) note = `次の1分は、もう一度の${day.again.length}枚からです。`;
  else if (day.rides >= 4) note = '今日の4回分はここまでです。';
  else note = '次のエレベーターでも、今日の15枚を思い出してください。';
  document.getElementById('summaryNote').textContent = note;
}

function beginSession(countRide) {
  ensureDaySet();
  if (countRide) {
    day.rides += 1;
    saveDay();
  }
  queue = buildQueue();
  pos = 0;
  knewCount = 0;
  missCount = 0;
  seenCount = 0;
  remainingMs = SESSION_MS;
  ended = false;
  grading = false;
  summary.hidden = true;
  hintEl.hidden = hintCount > 6;
  paintTimer();
  paintRide();
  if (!queue.length) { finish('complete'); return; }
  showFront();
  startTimer();
}

function speakCurrent() {
  if (!('speechSynthesis' in window) || ended) return;
  const idx = queue[pos];
  if (!validIndex(idx)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(phrases[idx].en);
    u.lang = 'en-US';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

card.addEventListener('click', e => {
  if (phase !== 'front') return;
  if (window.getSelection && String(window.getSelection())) return;
  reveal();
});
document.getElementById('btnAgain').addEventListener('click', e => { e.stopPropagation(); grade(false); });
document.getElementById('btnKnew').addEventListener('click', e => { e.stopPropagation(); grade(true); });
document.getElementById('btnMore').addEventListener('click', () => beginSession(false));
speakBtn.addEventListener('click', e => { e.stopPropagation(); speakCurrent(); });

let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (phase !== 'back') return;
  if (e.target.closest('button')) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) grade(dx > 0);
});

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (phase !== 'front') return;
    if (e.target.closest && e.target.closest('button') && e.target.offsetParent !== null) return;
    e.preventDefault();
    reveal();
  } else if (e.key === 'ArrowLeft') {
    if (phase === 'back') { e.preventDefault(); grade(false); }
  } else if (e.key === 'ArrowRight') {
    if (phase === 'back') { e.preventDefault(); grade(true); }
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseTimer();
  else if (!ended) startTimer();
});

beginSession(true);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
